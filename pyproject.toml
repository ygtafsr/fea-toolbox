[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fea-toolbox"
version = "0.1.0"
description = "FEA and structural analysis utilities."
authors = [{ name = "Yigit" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "ansys-dpf-core==0.16.3",
    "ansys-mapdl-core==0.74.1",
    "ansys-mapdl-reader==0.56.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "vtk==9.7.2",
    "ipykernel==7.4.0",
]

[tool.setuptools.package-data]
featoolbox = ["materials/materialdatabase.json"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


